openapi: 3.0.3
info:
  title: acm-db
  description: Low-level user database storage service.
  version: 1.0.0

paths:
  /db/users:
    post:
      summary: Save a new user record
      description: Called by acm-server during registration to store username and hashed password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password_hash]
              properties:
                username:
                  type: string
                  example: alice
                password_hash:
                  type: string
                  description: Hashed password string from acm-server
                  example: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
      responses:
        '201':
          description: Record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  user_id: { type: integer, example: 101 }
        '400':
          description: User already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "Username already exists" }

  /db/users/{username}:
    get:
      summary: Fetch user record by username
      description: Called by acm-server during /login to retrieve the stored password hash.
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
          example: alice
      responses:
        '200':
          description: User record found
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer, example: 101 }
                  username: { type: string, example: "alice" }
                  password_hash: { type: string, example: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8" }
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "User not found" }
